name: Feature request
description: Propose an improvement to Factory
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Describe the outcome you need without sharing private repository content. For a development Objective in your own target repository, use docs/templates/objective.yml there instead.
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should a Factory user or operator be able to do?
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Current limitation
      description: What prevents this today? Include any workaround you have tried.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and boundaries
      description: How could we verify the outcome? What is outside this request?
    validations:
      required: true
