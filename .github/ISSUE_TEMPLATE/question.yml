name: Question
description: Ask about using or configuring Factory
title: "question: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Check the README, setup guide, and existing issues first. Help is best effort; see [SUPPORT.md](https://github.com/clockgrove/factory/blob/main/SUPPORT.md). Report vulnerabilities privately through [SECURITY.md](https://github.com/clockgrove/factory/blob/main/SECURITY.md).
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: Describe your goal, your question, and what you have already tried.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: When relevant, include Factory and Node.js versions, installation method, Linux environment, and execution backend.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include the command or chat operation and the smallest sanitized diagnostic that helps explain your question. Do not include tokens, private source, raw environment dumps, or sensitive transcripts.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and removed credentials and private information.
          required: true
