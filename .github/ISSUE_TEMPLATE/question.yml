name: Question or idea
description: Ask how to do something with Pendulum, or suggest a change.
body:
  - type: markdown
    attributes:
      value: |
        Leave out tokens, keys and private code. Report a security problem privately instead: see [SECURITY.md](https://github.com/clockgrove/pendulum/blob/main/SECURITY.md).
  - type: textarea
    id: goal
    attributes:
      label: What you are trying to do
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: The Objective, setting or command you used, and what happened. Link the Objective's issue or PR when it is public.
  - type: input
    id: version
    attributes:
      label: Pendulum tag
      description: The tag your workflow pins, `clockgrove/pendulum@vX.Y.Z`, if you run it.
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      options:
        - Claude Code
        - Codex
        - GitHub Copilot
        - Not relevant
  - type: dropdown
    id: route
    attributes:
      label: Route
      options:
        - GitHub Actions
        - Local mode
        - Cloud sandbox
        - Not relevant
