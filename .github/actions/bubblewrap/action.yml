name: Install bubblewrap
description: The OS sandbox Factory runs worker-caused commands in, and pasta (passt) for its networked package installs, which the integration suite exercises.
runs:
  using: composite
  steps:
    # apt-get update was most of this step's time on every shard: the two
    # packages are kept per runner image and installed with dpkg instead.
    # The runner image's identity is in its environment, not the env context.
    - id: image
      run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      shell: bash
    - id: debs
      uses: actions/cache@v6
      with:
        path: ~/bubblewrap-debs
        key: bubblewrap-debs-${{ runner.os }}-${{ steps.image.outputs.image }}
    - run: |
        if [ "${{ steps.debs.outputs.cache-hit }}" != true ]; then
          sudo apt-get update -q
          mkdir -p ~/bubblewrap-debs
          (cd ~/bubblewrap-debs && apt-get download bubblewrap passt)
        fi
        sudo dpkg -i ~/bubblewrap-debs/*.deb
        # Ubuntu 24.04 can restrict unprivileged user namespaces to programs
        # with an AppArmor profile; allow them when bubblewrap cannot start.
        if ! bwrap --unshare-all --die-with-parent --ro-bind / / true; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --die-with-parent --ro-bind / / true
        fi
        bwrap --version
        pasta --version
      shell: bash
