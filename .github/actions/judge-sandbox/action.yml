name: Judge sandbox
description: >-
  Bubblewrap for the planning-eval judge sandbox. Ubuntu 24.04 restricts
  unprivileged user namespaces through AppArmor, so this grants them to
  /usr/bin/bwrap only (a scoped profile, not the global sysctl). Owner-approved
  in #705. Sets FACTORY_REQUIRE_SANDBOX=1 so the sandbox tests fail instead of
  skipping in CI.
runs:
  using: composite
  steps:
    - run: sudo apt-get install -y --no-install-recommends bubblewrap
      shell: bash
    - run: |
        sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
        abi <abi/4.0>,
        include <tunables/global>

        profile bwrap /usr/bin/bwrap flags=(unconfined) {
          userns,
        }
        PROFILE
        sudo apparmor_parser -r /etc/apparmor.d/bwrap
      shell: bash
    - run: bwrap --unshare-all --ro-bind / / true
      shell: bash
    - run: echo "FACTORY_REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"
      shell: bash
