name: Live check

# Nightly crash-restart check against real GitHub (scripts/live-check.mjs, #721).
# A scripted worker, planner and reviewer drive Factory through a three-item
# Objective in clockgrove/factory-smoke, killing the controller at four points
# (after an issue, a PR and a merge are created, and mid final review), once
# with regular delivery and once with a native stack. The verdict is counted
# from GitHub alone. No model is called, so it costs nothing but Actions time.
#
# OWNER SETUP (a workflow cannot create secrets):
#   Add a repository secret named FACTORY_SMOKE_TOKEN: a fine-grained personal
#   access token with
#     - resource owner: clockgrove
#     - repository access: only clockgrove/factory-smoke
#     - permissions: Contents read/write, Issues read/write, Pull requests
#       read/write, Checks read, Commit statuses read (Metadata read is implied)
#     - an expiry you will remember to renew
#   It must belong to the account that is the fixture's author. Nothing else
#   in the token may reach clockgrove/factory or any other repository. The
#   fixture's CI workflow and required-check ruleset come from
#   `node scripts/live-check.mjs setup` (needs repository admin; run once by
#   hand, never from here). Until the secret exists the first step fails and
#   the failure issue says so.
#
# A failure opens, or comments on, the one open issue labelled live-check.
# GITHUB_TOKEN (issues: write on this repository only) files that issue.
on:
  schedule:
    # UTC; Actions has no CRON_TZ. Off the hour, when scheduled runs queue.
    - cron: "7 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Two runs never overlap: they share the fixture repository and its Objectives.
concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live-check:
    if: github.repository == 'clockgrove/factory'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TAG_REGULAR: nightly-${{ github.run_id }}-regular
      TAG_STACK: nightly-${{ github.run_id }}-stack
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Sign in to GitHub as the fixture account
        env:
          GH_TOKEN: ${{ secrets.FACTORY_SMOKE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Repository secret FACTORY_SMOKE_TOKEN is not set; see the header of .github/workflows/live-check.yml"
            exit 1
          fi
          gh auth setup-git --hostname github.com
          git config --global user.name "Factory live check"
          git config --global user.email "factory-live-check@users.noreply.github.com"
          gh api user --jq .login
      - name: Regular delivery
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ secrets.FACTORY_SMOKE_TOKEN }}
        run: node scripts/live-check.mjs run --worker scripted --delivery regular --tag "$TAG_REGULAR"
      - name: Native stack delivery
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ secrets.FACTORY_SMOKE_TOKEN }}
        run: node scripts/live-check.mjs run --worker scripted --delivery native-stack --tag "$TAG_STACK"
      # The reports hold GitHub counts and launch output, never the HTTP log
      # or Factory state.
      - name: Collect reports
        if: ${{ always() }}
        run: |
          mkdir -p reports
          for tag in "$TAG_REGULAR" "$TAG_STACK"; do
            cp "/tmp/live-check-$tag/report.json" "reports/$tag.json" || true
            cp /tmp/live-check-"$tag"/launch-*.log reports/ || true
          done
          node scripts/live-check-report.mjs "$RUN_URL" "$TAG_REGULAR" "$TAG_STACK" > reports/summary.md
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: live-check-reports
          path: reports
          retention-days: 30
      # Leave the fixture clean: close each Objective this run made, however
      # it ended. `reset --objective` refuses anything that is not one.
      - name: Reset the fixture
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.FACTORY_SMOKE_TOKEN }}
        run: |
          for tag in "$TAG_REGULAR" "$TAG_STACK"; do
            number=$(gh issue list -R clockgrove/factory-smoke --state all --search "\"Live check $tag\" in:title" --json number --jq '.[0].number // empty') || continue
            if [ -n "$number" ]; then node scripts/live-check.mjs reset --objective "$number" || true; fi
          done
      - name: Open or update the failure issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create live-check --description "Nightly live crash-restart check" --color d93f0b || true
          number=$(gh issue list --label live-check --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file reports/summary.md
          else
            gh issue create --label live-check --title "Nightly live check failed" --body-file reports/summary.md
          fi
      - name: Note recovery on the open issue
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --label live-check --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "The nightly live check passed: $RUN_URL. Close this issue once the failure is understood."
          fi
