name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run format:check
      - run: npm run notices:check

  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: git lfs version
      - run: node --test --test-shard=${{ matrix.shard }}/4 test/*.test.mjs

  # The single required check for main; it passes only when every job above passes.
  package-gate:
    if: always()
    needs: [checks, tests]
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.checks.result }}" = success && test "${{ needs.tests.result }}" = success
