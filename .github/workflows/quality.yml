name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older runs; every push to main
# runs to completion in its own group.
concurrency:
  group: quality-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run format:check
      - run: npm run notices:check

  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/bubblewrap
      - run: git lfs version
      - run: npm run test:core

  # The single required check for main; it passes only when every job above
  # passes, including the packed tarball installed offline (core/test).
  package-gate:
    if: always()
    needs: [checks, core]
    runs-on: ubuntu-24.04
    steps:
      - env:
          CHECKS: ${{ needs.checks.result }}
          CORE: ${{ needs.core.result }}
        run: |
          test "$CHECKS" = success
          test "$CORE" = success
