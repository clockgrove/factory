name: Quality
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: The Action's manifest and the workflows parse as YAML
        run: python3 -c 'import glob, yaml; [yaml.safe_load(open(f)) for f in ["action.yml", *glob.glob(".github/workflows/*.yml")]]'
      # plugin/vendor holds the libraries the plugin ships (it runs with nothing installed): byte for byte what
      # tools/deps/package-lock.json installs, with no install scripts (docs/PLAN.md, "Dependencies").
      - name: The vendored libraries match their lockfile
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/deps
          node tools/deps/sync.mjs --check
      # Correctness only, no style: a name never defined, a binding read before it is set (a parameter default that
      # names itself), a local that hides an import. Unit tests stub what they call and miss these.
      - name: Lint for undefined names and hidden imports
        run: npm run lint --prefix tools/deps
      # Every skill follows the Agent Skills standard (agentskills.io): its name matches its folder, its description and
      # frontmatter are what Claude Code, Codex and Copilot accept. A skill they would drop silently fails here instead.
      - name: Every skill follows the Agent Skills standard
        run: |
          python3 -m venv "$RUNNER_TEMP/skills-ref"
          "$RUNNER_TEMP/skills-ref/bin/pip" install --quiet --require-hashes --only-binary :all: -r tools/deps/requirements-skills.txt
          for d in plugin/skills/*/; do "$RUNNER_TEMP/skills-ref/bin/agentskills" validate "$d"; done
          # The check bites: a skill that breaks the rules must fail it.
          if "$RUNNER_TEMP/skills-ref/bin/agentskills" validate bench/test/fixtures/skills/bad-name/; then echo "::error::skills-ref accepted a skill that breaks the rules"; exit 1; fi
      # The tests run with an empty temp folder of their own, and must leave it empty: a developer's box runs them many
      # times a day, and what they left behind once filled /tmp's inodes (#2565).
      # Local mode needs ripgrep (the sandboxes' scan for protected paths), so tests of its real stage setup do too.
      - name: ripgrep, as local mode needs it
        run: sudo apt-get install -y --no-install-recommends ripgrep
      - name: An empty temp folder for the tests
        run: mkdir "$RUNNER_TEMP/tests"
      - name: Plugin tests
        run: node --test plugin/test/*.test.mjs
        env:
          TMPDIR: ${{ runner.temp }}/tests
      - name: Bench tests
        run: node --test bench/test/*.test.mjs
        env:
          TMPDIR: ${{ runner.temp }}/tests
      - name: The tests left the temp folder empty
        run: |
          left="$(ls -A "$RUNNER_TEMP/tests")"
          if [ -n "$left" ]; then echo "::error::the tests left these in their temp folder: $(echo $left)"; exit 1; fi
      - name: Skills within the one-page cap
        run: node bench/skills.mjs
