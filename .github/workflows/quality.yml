name: Quality

on:
  pull_request:
  # The merge queue runs the checks on each pull request on top of main and
  # everything queued ahead of it; package-gate is the check it waits for.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older runs; every push to main
# runs to completion in its own group.
concurrency:
  group: quality-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run format:check
      - run: npm run notices:check

  # npm test's run, split across the shards by scripts/test-partition.mjs,
  # balanced by the seconds each file took in test/timings.json and the
  # name order node --test starts them in. Refresh the timings from a run's
  # test-durations.json files (scripts/test-timings.mjs) when the shards
  # drift apart. Four shards beat three by about 12 s on runner-sized CPUs;
  # package.test.mjs alone takes about a minute, so more would gain
  # little. Each shard builds for itself: tsc takes under 10 s,
  # and a build job would put its own runner, setup, build and artifact
  # upload ahead of every shard.
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Report every shard's failures, as one unsharded run would.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/bubblewrap
      - run: git lfs version
      - run: npm run build
      # A step of its own: a partition that fails fails the job, rather than
      # leave node --test no files, which would run every file again.
      - run: >-
          node scripts/test-partition.mjs
          ${{ matrix.shard }} ${{ strategy.job-total }} > test-shard.txt
      - run: >-
          node --test --test-timeout=120000
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./scripts/test-files.mjs
          --test-reporter-destination=test-files.txt
          --test-reporter=./scripts/test-durations.mjs
          --test-reporter-destination=test-durations.json
          $(cat test-shard.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: test-files-${{ matrix.shard }}
          path: |
            test-files.txt
            test-durations.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # The single required check for main; it passes only when every job above
  # passes, including offline installation in the CI tests, and the test
  # shards between them ran every test file exactly once.
  package-gate:
    if: always()
    needs: [checks, tests]
    runs-on: ubuntu-24.04
    steps:
      - env:
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          test "$CHECKS" = success
          test "$TESTS" = success
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: test-files-*
          path: test-files
      - run: node scripts/test-shards.mjs test-files/*/test-files.txt
