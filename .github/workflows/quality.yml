name: Quality
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Plugin tests
        run: node --test plugin/test/*.test.mjs
      - name: Bench tests
        run: node --test bench/test/*.test.mjs
      - name: Skills within the one-page cap
        run: node bench/skills.mjs
