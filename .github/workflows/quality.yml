name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git lfs version
      - run: npm run build
      - name: Run Biome lint and compatibility rules
        run: npm run lint
      - name: Check Biome and fallback formatting
        run: npm run format:check
      - run: npm run notices:check
      - name: Run proportional PR tests
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/test-pr.mjs --base "$PR_BASE_SHA"
      - name: Run complete main tests
        if: github.event_name != 'pull_request'
        run: node --test test/*.test.mjs
