name: Release

# Push an annotated vX.Y.Z tag on a main commit to publish that version.
# Prepare the version first with `node scripts/version.mjs set X.Y.Z`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      checks: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check tag and version identities agree
        run: node scripts/version.mjs check "$GITHUB_REF_NAME"
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # The merge queue ran Quality on this exact commit before main took
      # it, so the release reuses that result instead of running the suite
      # again on one runner.
      - name: Require Quality to have passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=package-gate" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success")] | length')"
          test "$passed" -gt 0

      - run: npm ci

      - name: Pack
        run: |
          mkdir artifacts
          npm pack --pack-destination artifacts
          cd artifacts && sha256sum ./*.tgz > SHA256SUMS && cat SHA256SUMS
      - name: Install the packed tarball offline, as the README does
        run: |
          prefix="$(mktemp -d)"
          npm_config_cache="$(mktemp -d)" npm install --offline --prefix "$prefix" ./artifacts/*.tgz
          "$prefix/node_modules/.bin/factory" help

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/*.tgz

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # X.Y.Z-suffix versions are prereleases, so the README's latest-release CLI install skips them.
          prerelease=()
          [[ "$version" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" artifacts/*.tgz artifacts/SHA256SUMS \
            --verify-tag --title "Factory $version" --generate-notes "${prerelease[@]}"
