# clockgrove/pendulum: one composite Action, nine modes (dispatch | work | review | gate | launch | image | sweep | watch | account).
# The adopter's workflow (see workflow-template.yml) calls it once per job: dispatch, then work and review on the
# runner, or, with a cloud sandbox (`sandbox: vercel`), launch jobs that start each stage in the Objective's sandbox and an
# image job that builds the sandbox image every stage starts from. Every
# GitHub write goes through the adopter's Pendulum GitHub App (app_id + app_private_key,
# minted into a short-lived installation token here and kept in memory); the harness runs as
# its own uid with a read-only token and writes nothing (plugin/scripts/lib/agent.mjs). The job's own GITHUB_TOKEN
# reads usage artifacts and never reaches the harness. This Action never creates an App.
name: Clockgrove Pendulum
description: Build a labelled GitHub issue unattended, review it, and hand it to the merge queue.
author: Clockgrove
branding:
  icon: clock
  color: green

inputs:
  mode:
    description: Which job this call runs. `dispatch` outputs the ready issue list; `work` builds one issue (needs `issue`); `review` reviews one PR (needs `pr`); `gate` decides whether an event starts anything (no install, no sandbox call); `launch` turns the event (or the dispatcher's pick, `issue`) into one stage start in the Objective's cloud sandbox (needs `sandbox`); `image` builds the sandbox image from the default branch's head with the repository's setup command (needs `sandbox` and a checkout); `sweep` destroys the Objective sandboxes no live Objective needs (needs `sandbox`); `watch` reads the merge queue entries of the PRs in `pr` (the dispatcher's `queue_watch`) until one leaves the queue or stalls there, and outputs `tick` (no install, reads only). `account` picks the account the next step's stage runs on, when the workflow's env block declares PENDULUM_ACCOUNTS (the Objective in `issue`, or the review's PR branch; with PENDULUM_AUTO_ACCOUNT on, a free one by the account holds Pendulum keeps on GitHub), and outputs `account`, the account whose secrets the stage's step gets (no install, reads only).
    required: true
  issue:
    description: The Objective issue number (mode work, mode account), or one issue to dispatch alone (mode dispatch, from workflow_dispatch).
    required: false
  account:
    description: '(work, review, launch) The account the stage runs on, the `account` output of the job''s account step (empty when the repository declares no accounts or the workflow was rendered for other ones, `-` when the step picked none): its credential is the only one the workflow passes, and the stage records the name and Blocks when its labels pick another. Never a secret.'
    required: false
  rendered_accounts:
    description: '(account) The accounts setup rendered the workflow''s credential inputs for (PENDULUM_ACCOUNTS as one line of JSON, empty for none). With other accounts declared in the env block now, the step picks none, since the jobs name only these accounts'' secrets, and the stage Blocks asking for a re-render.'
    required: false
  pr:
    description: The pull request number to review (mode review), or the JSON list of PR numbers to watch (mode watch).
    required: false
  harness:
    description: The harness that runs the worker and the reviewer, `claude`, `codex` or `copilot`; the repository's default, which an Objective's `pendulum:harness:<name>` label overrides for that Objective.
    required: false
  model:
    description: The worker session's model (the strong one); the harness default when empty. The repository's default, which an Objective's `pendulum:model:<id>` label overrides for that Objective.
    required: false
  effort:
    description: The worker session's effort level (Claude `--effort`, Codex `model_reasoning_effort`, Copilot `--reasoning-effort`; the levels each model supports); the harness default when empty. Pinned so a CLI default change cannot move cost silently.
    required: false
  sibling_hold:
    description: Whether a hand-off to review waits for a sibling Objective whose PR it conflicts with (a trial merge of the two heads). `on` (default) holds a head no review has seen while such a sibling is ahead of it, then releases waiting PRs one at a time, each rebasing once; `off` holds no hand-off, and overlapping PRs rebase when they conflict. Scheduling only.
    required: false
  resume_policy:
    description: Which re-entries resume the worker's saved session instead of starting fresh, on every harness. `fresh` (default) resumes none; `fix-passes` resumes the review job's fix and answer passes and a rebase send-back that conflicts. An answered Question always starts fresh.
    required: false
  publish_transcripts:
    description: '`true` uploads the harness''s event stream (`events.jsonl`) and saved sessions (`transcript/`) readable in the usage artifact on a public repository, where anyone signed in to GitHub can download them for 90 days. `false` (default) seals them there: encrypted with AES-256-GCM under a key derived from the App''s private key, so only this workflow''s jobs open them (a later stage resuming the session); the usage record (`result.json`) stays readable. A private repository''s artifacts carry them readable either way, since only those who can read the repository can download them. Doctor warns while this is on for a public repository. Only the workflow file sets it, never a repository variable.'
    required: false
  compaction_window:
    description: The context size, in tokens such as 300000, at which the worker and reviewer sessions compact (Claude and Codex; Copilot has no such setting and compacts on its own); the CLI default when empty. A measured lever for large Objectives, off by default.
    required: false
  prompt_cache_ttl:
    description: 'Claude''s prompt-cache lifetime for the worker and reviewer sessions (`CLAUDE_CODE_PROMPT_CACHE_TTL`, the main conversation; sub-agents keep the CLI default). `off` (default) leaves the CLI default until the A/B in bench/README.md is run. `auto` asks for `1h` when the run bills an API key, which otherwise gets five minutes, so a fix pass after a CI wait re-writes the whole prefix; a plan token already gets an hour. `1h` or `5m` set that on every credential. Any other value is refused with a warning and reads as `off`. Codex and Copilot manage their own caching. The usage record''s `cache` shows the writes after each CI wait, so the setting is measured, not assumed.'
    required: false
  subagent_model:
    description: The implementer sub-agents' model, pinned in the agent definitions the job writes into the checkout. The repository's default, which an Objective's `pendulum:subagent-model:<id>` label overrides for that Objective.
    required: false
  reviewer_model:
    description: The reviewer's model for its one comment-only pass; `model` when empty. The repository's default, which an Objective's `pendulum:reviewer-model:<id>` label overrides for that Objective.
    required: false
  reviewer_effort:
    description: The reviewer's effort level for its one pass (Claude `--effort`, Codex `model_reasoning_effort`, Copilot `--reasoning-effort`). Empty is the harness's reviewer default, passed on every reviewer call - Codex `high` (its reviewer agent file), Claude and Copilot their CLI default (nothing passed) - since no harness applies its agent file's effort to that call.
    required: false
  credential:
    description: '`api` (default) bills an API credential; `plan` uses CLAUDE_CODE_OAUTH_TOKEN and is for your own repository only. (`login`, the CLI''s own login, exists for a developer''s machine and is refused here.)'
    required: false
  max_concurrent:
    description: How many worker jobs may run at once; the dispatcher starts up to this minus the ones running.
    required: false
  guess_hours:
    description: How many hours automatic account choice passes over an account whose usage limit or quota reported no reset, by how many in a row (the last for every one after); `1, 4, 24` when empty. A list of hours, comma or space separated, each a number above 0 and at most 192 (8 days, the longest hold kept). In local mode, machine.json's `guess_hours` wins on that machine.
    required: false
  rebase_limit:
    description: How many times in 24 hours a PR goes back to its worker to rebase after other PRs merged (each a worker run) before its Objective Blocks; 5 when empty. A whole number above 0. Scheduling only.
    required: false
  daily_usd:
    description: 'The dispatcher starts nothing once today''s spend passes this many dollars (UTC day): the usage artifacts of Actions runs plus the spend lines local runs write into their progress comments.'
    required: false
  copilot_credit_usd:
    description: 'Dollars per GitHub AI credit for Copilot runs, a positive number; GitHub''s published $0.01 when empty (any other value is refused with a warning). Each Copilot run records the AI credits and premium requests its usage file reports, and its dollars (credits at this rate) count toward `max_usd`, `daily_usd` and the scorecard like the other harnesses''.'
    required: false
  max_usd:
    description: The per-job dollar cap. The worker job's runs (the first prompt and each validation fix) share it, less the job's drift reserve (10% of it, at least $0.30, at most all of it), which only the drift advisory spends; Claude gets what is left as `--max-budget-usd` and Copilot as `--max-ai-credits` (Copilot takes no less than 30 credits, so with less than 30 credits' worth left no Copilot run starts); every harness is also checked after each run, and a Copilot run that reports no priced AI credits ends the job, since the cap cannot be enforced. The review job has the same cap of its own.
    required: false
  max_objective_usd:
    description: 'The dollar cap on one Objective across all its stages and parts (work, review, rebases, every split part), a number; empty or 0 is no cap. Every work and review stage checks it before any pass: once the Objective''s known spend since its last restart or reopening (its stages'' spend lines, else their own runs'' usage artifacts, the sandbox vendor''s cost and the decision calls made outside a stage) reaches it, the stage starts nothing and the Objective Blocks, naming the cap and the total. Runs of unknown cost count nothing toward it, so they never stop a stage.'
    required: false
  timeout_minutes:
    description: The per-Objective wall clock; the worker stops its own work before it and the job's `timeout-minutes` should match. Under 360 on hosted runners.
    required: false
  auto_merge:
    description: '`true` (default): Pendulum merges the reviewed, validated head itself once its required checks are green (it enqueues that exact head on a merge queue), with no human read; nothing is armed that a later push could ride. `false` leaves a ready-for-review PR.'
    required: false
  notify:
    description: 'The GitHub handle that Blocked comments @mention, and Question drafts request as reviewer, written `login#id` (its numeric user id, as setup writes it) so Pendulum also trusts it as a maintainer by id; a bare login is mentioned but not trusted.'
    required: false
  maintainers:
    description: 'More maintainers Pendulum trusts beside `notify`, comma-separated, each `login#id` (the numeric user id). Their comments answer a Question and their markers count, whatever the App can see of their access (an organization member with private membership looks like a contributor to it). Matched by id, so a login renamed away is a stranger; a bare login is trusted for nothing.'
    required: false
  setup:
    description: The repository's toolchain command, run in the checkout before the worker (for example `scripts/ci/toolchain.sh postgresql`). Empty runs nothing.
    required: false
  install:
    description: '`auto` (default) installs the versions each lockfile in the repository''s root pins, one install per ecosystem, all of them: Node.js `pnpm install --frozen-lockfile` (offline from its store first, else online), `npm ci` or `yarn install --frozen-lockfile` (the one package.json''s `packageManager` names, else in that order); Rust `cargo fetch --locked`; Python `poetry install --no-root` or `uv sync --frozen` (in that order); Go `go mod download`. The list is closed: no file in the repository picks the command. It uses the network the stage allows and runs with no credential in its environment; npm, pnpm and yarn skip install scripts (`--ignore-scripts`), while a Python install that builds a source package runs its build. Each install''s program (`cargo`, `uv`, `go` and the rest) must be on PATH where the stage runs: setup installs it otherwise, and doctor''s lockfile row warns when it is not found. `none` skips; any other value is the command to run. An install that exits non-zero, or leaves a linked dependency or its declared binary missing, gets one clean reinstall (node_modules emptied, the package caches kept); still broken, the stage Blocks naming the install as infrastructure, before any validation runs. One whose program is not on PATH Blocks at once, naming the program.'
    required: false
  validation:
    description: 'The repository''s validation commands, comma- or newline-separated, named in the task card for the harness. Without `ci_checks` (and in local mode) they are also Pendulum''s own validation: the listed commands run in order, the run stopping after the first command (or `parallel: ` group) with a failure, and each red goes to a fix pass until it is green, a fix pass makes no progress, or `max_usd` or the wall clock runs out (no fixed count of passes). A command marked `parallel: ` runs at the same time as the marked ones beside it; unmarked ones run in order. In a workflow''s env block, quote a value that holds such a mark.'
    required: false
  budget_command:
    description: The test-budget command named in the task card, if the repository has one.
    required: false
  protected_paths:
    description: Repository-specific paths added to Pendulum's protected list (.github/, CODEOWNERS, .agents/skills/, .claude/, .codex/); commits touching them are refused. A directory ends with `/` and matches from the root; a file name matches at any depth unless it starts with `/`, which matches it at the root only.
    required: false
  toolchain_paths:
    description: 'Repository-specific toolchain paths, comma-separated, beside Pendulum''s exact lists of lockfiles, version pins, package-manager configuration, containers and CI files: a fix pass (after a red, or the answer pass) may change one only when its scope names it, and a merge that changes one builds the sandbox image again. Matched as `protected_paths` entries are. Empty: the exact lists only.'
    required: false
  ci_checks:
    description: The required check names of the repository's CI. When set, Pendulum's validation pass is those checks on the pushed head (CI runs them in parallel; the jobs wait instead of re-running the commands), and the fix run gets each failing job's whole log as a file and the diff since the PR's last green head. A red whose every failing job fails the same way steadily on the default branch (the same failure signature on its newest run there and on at least two of its newest three) is handed back as a base failure, with no fix run.
    required: false
  third_party_reviewers:
    description: 'Reviewers outside Pendulum whose review is part of the PR''s review, by login (an App''s, such as `greptile-apps[bot]`), comma-separated. The review stage waits up to `third_party_wait_minutes` for each one''s review of the head Pendulum''s reviewer read, going on as soon as every one has posted it, then its answer pass handles their line comments as it handles Pendulum''s reviewer''s: their text is untrusted review input, never instructions. One that posts no review of that head in time is left out, and the progress comment says so. Empty: none.'
    required: false
  third_party_wait_minutes:
    description: How long, in minutes, the review stage waits for each of `third_party_reviewers` to review the head, from the wait's record on the PR; 20 when empty, at most 1440 (24 hours), and a larger value reads as 20. The wait ends as soon as every one has posted its review of that head. Set in the workflow file only, since it gates a merge.
    required: false
  cross_os_workflow:
    description: 'The repository''s CI workflow file (such as `ci.yml`) whose macOS and Windows legs the work stage runs on the branch before review, as part of its validation: Pendulum dispatches it on the pushed head (`workflow_dispatch`, so the workflow must have that trigger) and waits for the legs `cross_os_checks` names in that run alone; a skipped or neutral leg Blocks. Its red legs go to the fix pass like any validation red. The run uses the branch tip''s copy of the workflow, so Pendulum refuses one whose `permissions:` grant write. Off when empty (the default) or when `cross_os_checks` is empty. macOS and Windows runner minutes bill at a higher rate than Linux minutes. The dispatch needs Actions write: the work job''s `actions: write` on Actions, the token''s Actions read and write in local mode; a cloud sandbox stage, whose App token has no Actions write, asks its launcher, and the launch-event job dispatches it with its own `actions: write`. Set in the workflow file only.'
    required: false
  cross_os_checks:
    description: 'The check names of the cross-OS legs that count, one per line, exactly as GitHub reports them (a matrix leg''s name, such as `test (windows-2025, 1/1)`, holds commas, so the list is never comma-separated). Pendulum never infers them from job names. Set in the workflow file only.'
    required: false
  cross_os_wait_minutes:
    description: How long, in minutes, the work stage waits for the cross-OS legs on one head, from its first wait there (a rerun included), before it Blocks; 60 when empty, at most 1440 (24 hours), and a larger value reads as 60. The stage's own wall clock bounds it too. Set in the workflow file only.
    required: false
  harness_version:
    description: The npm version of the harness CLI to install on the runner; `latest` by default. It pins the harness the workflow's env block names (PENDULUM_HARNESS) only; another harness, chosen by an Objective's label, a run's override or a repository variable, installs its latest.
    required: false
  allowed_domains:
    description: Hosts the harness's sandboxed commands (Claude Code, Codex or Copilot) may reach on Actions and in a cloud sandbox, beyond GitHub and the npm and Yarn registries (comma or space separated; `*.example.com` covers its subdomains), for every Objective; one Objective's own host goes in its `pendulum:host:<host>` label. The Actions and cloud sandbox counterpart of local mode's PENDULUM_LOCAL_DOMAINS.
    required: false
  node_version:
    description: The Node.js version set up on the runner for the harness CLI and the repository's commands (default 22; set it to what your CI uses).
    required: false
  project:
    description: 'The node id of the repository''s Pendulum Project board, which setup records as it creates the board. Empty, Pendulum looks for the board linked to the repository titled exactly `Pendulum: <repository>`.'
    required: false
  app_id:
    description: The adopter's Pendulum GitHub App id (secret PENDULUM_APP_ID). Required.
    required: true
  app_private_key:
    description: The App's private key PEM (secret PENDULUM_APP_PRIVATE_KEY). Required; used only to mint a short-lived installation token.
    required: true
  anthropic_api_key:
    description: 'ANTHROPIC_API_KEY for the Claude harness. Leave empty to use workload identity federation (needs `id-token: write` and `anthropic_oidc_exchange_url`).'
    required: false
  anthropic_oidc_exchange_url:
    description: The endpoint that exchanges the job's OIDC token for a short-lived Anthropic credential, when using federation instead of a key.
    required: false
  claude_code_oauth_token:
    description: 'A long-lived Claude Code token for `credential: plan`; your own repositories only, never for a product.'
    required: false
  codex_api_key:
    description: CODEX_API_KEY for the Codex harness; passed to the harness child process only, never to the job environment.
    required: false
  codex_gateway_key:
    description: 'A Vercel AI Gateway key (secret PENDULUM_CODEX_GATEWAY_KEY) for the Codex harness: Codex then runs through the gateway and bills its credits at the provider''s list price. Wins over codex_api_key when both are set. Passed to the harness child process only, never to the job environment or the worker''s shell; never Pendulum''s own AI_GATEWAY_API_KEY.'
    required: false
  copilot_github_token:
    description: 'A fine-grained token with only the Copilot Requests permission, from a user with a Copilot seat, for the Copilot harness; it bills that seat. Passed to the harness process only; doctor checks it cannot write to the repository. Required for Copilot: the job token is never used.'
    required: false
  sandbox:
    description: 'The cloud-sandbox vendor the launch jobs start stages in (docs/ADAPTERS.md): `vercel`. Empty (default) runs Objectives on the runner, in the work and review jobs.'
    required: false
  vercel_token:
    description: 'VERCEL_TOKEN for `sandbox: vercel` (secret VERCEL_TOKEN). Read by the launcher only; never in a harness''s or command''s environment.'
    required: false
  vercel_team_id:
    description: 'VERCEL_TEAM_ID for `sandbox: vercel`.'
    required: false
  vercel_project_id:
    description: 'VERCEL_PROJECT_ID for `sandbox: vercel`: the Vercel project the sandboxes belong to.'
    required: false
  image_refresh:
    description: '(image) `merge` (default) builds the sandbox image on a push to the default branch that changes what the image is made from (docs/ADAPTERS.md, Refresh) until today''s builds reach `image_daily_minutes`, then leaves the head to the next UTC day''s first dispatcher tick (`image_owed`; the nightly schedule is the backstop); `nightly` builds a head once a day, on that tick or the nightly schedule.'
    required: false
  image_daily_minutes:
    description: '(image) Build minutes a day the image may take on merges before refreshes move to the nightly build. Default 5.'
    required: false
  image_max_age_days:
    description: '(image) Days the current image stands for later heads that change nothing it is made from; an older image is built again on the next merge, owed tick or nightly build. A whole number, 1 to 30. Default 7.'
    required: false
  image_owed:
    description: '(image) `true` builds the default branch''s head on an event other than a push, the nightly cron or `image: true`: the dispatcher''s `image_owed` output, when an earlier day left the head unbuilt and today''s turn allows a build.'
    required: false
  sandbox_idle_days:
    description: '(sweep) Days an Objective''s sandbox may stay stopped, the Objective neither Running nor In review, before the sweep destroys it. Default 7.'
    required: false
  sweep_max_destroys:
    description: '(sweep) Sandboxes one sweep run destroys at most. Default 5.'
    required: false
  usage_limit_waits:
    description: How many times one harness pass waits in place for its subscription's usage limit to reset before the stage ends on it; 2 when empty. A whole number from 0 to 10. Scheduling only.
    required: false
  usage_limit_move_minutes:
    description: On GitHub Actions and in the cloud sandbox with automatic account choice, a usage limit that resets further away than this many minutes, while another account is free, ends the stage so the Objective goes on there, starting afresh from its branch; 60 when empty. A number above 0, at most 1440. Scheduling only.
    required: false
  claim_pause_hours:
    description: How long an Objective a local loop holds may stay paused while that loop is away (its machine asleep or off, serve stopped) before the dispatcher Blocks it, and how long a pendulum:local Objective no loop has claimed (Running, or In review with its review owed) or whose claim cannot be read waits for one; 24 when empty. A number from 2 (twice the hourly beat a loop writes on a paused claim, and twice the most a local stage waits in place) to 720 (30 days). Keep it above local mode's PENDULUM_LOCAL_OUTAGE_HOURS, so an outage Blocks naming the outage first.
    required: false
  sibling_wait_hours:
    description: The longest a hand-off to review, or a conflicting PR's rebase, waits for a sibling ahead of it that it conflicts with (sibling_hold), counted from its first wait; then it goes on beside the sibling. 6 when empty. A number above 0, at most 168 (7 days). Scheduling only.
    required: false
  max_parts:
    description: The most sequential PRs one Objective splits into; a split with work left after the last Blocks. It bounds how many PRs, not the spend; each part's work and review jobs are capped by max_usd separately, and its rebases, re-reviews and resumed stages each have that cap too, on top; `max_objective_usd` caps them all together. 6 when empty. A whole number from 1 to 50.
    required: false
  step_stall_factor:
    description: A required check's step on a merge queue commit has hung once it runs past this many times its longest duration in the workflow's recent green runs (and past that duration plus step_stall_floor_minutes); Pendulum then takes the PR out of the queue and puts it back once. 3 when empty. A number from 1 to 100. Scheduling only.
    required: false
  step_stall_floor_minutes:
    description: The least time over a step's longest recent green duration before it counts as hung on a merge queue commit (step_stall_factor), and how old the queue commit must be before its checks are judged; 15 when empty. A number from 1 (under a minute every queue commit would be judged at once) to 1440. Scheduling only.
    required: false
  queue_stall_minutes:
    description: How long a merge queue commit may wait with no CI begun on it before Pendulum takes the PR out of the queue and puts it back once; 10 when empty. A number from 1 (under a minute every queue commit would be stalled as it is made) to 1440. Scheduling only.
    required: false
  ai_gateway_api_key:
    description: 'A Vercel AI Gateway key (secret AI_GATEWAY_API_KEY) for Pendulum''s decision calls, which then ask the gateway''s decision models. Red-check triage: when a required check is red, each failing job is asked whether the change broke it or it is a flake; only when every failing job reads flaky at confidence 0.7 or more are the failed jobs rerun (once per head) instead of a fix pass. Each job''s log window and the PR''s file list go to the decision model. The drift advisory: while a worker''s harness runs, at most every two minutes, it is asked whether the agent is on task, drifting into scope creep or looping (the plan''s items, its last 12 activity entries and the files it edited go to the decision model); a drift label at confidence 0.7 or more writes one line on the progress comment, and never changes the run. The answer gate, on the triage model: whether what the answer and fix passes wrote after the review does only what its findings and the failing checks asked (that diff, the findings and the failures, up to 32 KiB in one question, go to the decision model; a larger diff goes in parts, by file and then by hunk, each with the findings and failures, and is covered only when every part is; a part left when the stage''s max_usd or wall clock is reached is not judged); anything else, or `only_asked` under confidence 0.7, gets a review pass. The finding check, on the triage model: whether each answer resolves its reviewer finding, unless a test the answer names fails without the fix and passes with it (or fails on the head). The answer check, on the triage model: whether the writer comments since a Question give a decision on it (the Question''s notice and the comments go to the decision model); only `no_decision` at confidence 0.7 or more keeps the Question open; with a key the dispatcher and the launcher ask it before any stage starts, and each verdict is kept on the issue so no version of a comment is asked about twice. Empty: the stage''s own harness answers the same questions on its own credential, one short call with no tools per question (decision_route; docs/ADAPTERS.md, Decision model). Used by Pendulum''s own process only, never passed to the harness or any command.'
    required: false
  worker_secrets:
    description: 'Opt-in, off by default: the secrets the worker''s shell gets, comma or space separated, each `NAME` or `NAME=SOURCE` (the shell gets SOURCE''s value as NAME), for example `AI_GATEWAY_API_KEY=WORKER_AI_GATEWAY_API_KEY`. Usually set as PENDULUM_WORKER_SECRETS in the workflow''s env block, which local mode reads too. Any code the worker runs can read and spend them: use a dedicated key with a budget the provider enforces (docs/PLAN.md, Worker secrets). Refused (such an entry never reaches the shell): the model credentials and Pendulum''s, the runner''s and GitHub''s tokens; any name starting PENDULUM_, GITHUB_, GH_, ACTIONS_, RUNNER_, ANTHROPIC_, CLAUDE_, CODEX_, OPENAI_ or COPILOT_; the process settings PATH, HOME, TMPDIR, SHELL, USER, LOGNAME, PWD, CI, BASH_ENV, ENV, NODE_OPTIONS, NODE_PATH, NODE_EXTRA_CA_CERTS, NODE_TLS_REJECT_UNAUTHORIZED, BUN_OPTIONS, PYTHONPATH, PYTHONHOME, PYTHONSTARTUP, PERL5LIB, PERL5OPT, RUBYOPT, SSL_CERT_FILE, SSL_CERT_DIR, SSLKEYLOGFILE, HTTP_PROXY, HTTPS_PROXY, ALL_PROXY, NO_PROXY and any name starting LD_, DYLD_, GIT_, NPM_CONFIG_ or SUDO_ (case-insensitive); a name shaped like a key (vck_, ghp_, github_pat_, sk-, xox…); and Pendulum''s own AI_GATEWAY_API_KEY secret as SOURCE. Only the worker''s harness gets them (the work stage''s passes and the review stage''s fix and answer passes); the setup, install and validation commands and the reviewer never do. An AI Gateway key (NAME AI_GATEWAY_API_KEY) is never handed over: Pendulum relays it, metered against max_usd, and the shell gets a relay token and PENDULUM_GATEWAY_URL (docs/PLAN.md, The gateway relay).'
    required: false
  worker_secret_values:
    description: 'The values of the `worker_secrets` SOURCEs, one `SOURCE=value` line each: the template passes the secret PENDULUM_WORKER_SECRET_VALUES (work, review and launch jobs). A line whose SOURCE `worker_secrets` does not name opts nothing in. Passed to the worker''s harness only (the work stage and the review stage''s fix and answer passes, never the reviewer), masked in the job log and the uploaded harness stream.'
    required: false
  decision_route:
    description: 'Who answers Pendulum''s decision calls (red-check triage, the drift advisory, the answer gate, the finding check, the rebase check, the answer check, the fix-progress check, the edit check, the fence check, the comment check, the plan-answer check). `auto` (default): the AI Gateway''s decision models with `ai_gateway_api_key`, else the stage''s own harness on its own credential. `gateway`: the gateway only, so without a key no decision call runs. `off`: none run; every red goes to the fix pass, no drift check runs, every answer and fix pass that commits after the review gets a review pass, a reply resolves its reviewer finding unjudged, a send-back''s conflict pass is checked by matching commits rather than by content, a writer''s comment on a Question resumes it unjudged, a red after a fix pass the exact checks cannot judge counts as no progress, which Blocks, any edit to an Objective''s title, body or harness, model and host labels after its plan was made makes the plan and code stale, a fix pass''s lockfile change outside its scope is refused unjudged, a writer''s comment no pass has read holds a reviewed PR''s merge unjudged until the review stage applies it, and a plan-time Question is answered only by a comment naming the repository. On the harness, each call is one short request on the stage''s model (the reviewer''s in the review stage) whose spend counts toward max_usd: one per failing CI job at a red, a drift check every two minutes while a worker runs, one answer-gate call per review stage whose passes committed (one per part of a diff too large for one question), one per answered reviewer finding, one per file a send-back''s conflict pass left other than the branch''s, one per version of the newest writer comment on a Question, asked first thing in the work stage it resumes and never twice for one version; one per red after a fix pass whose progress the exact checks cannot tell; one per distinct text of an Objective edited after its plan; one per version of each lockfile a fix pass changed outside its scope; one per set of unread writer comments on a reviewed, green PR about to merge (on the gateway only where the merge pass runs outside a stage); one per repository a plan-time Question named that a maintainer commented on since; on Copilot each call is a premium request.'
    required: false
  triage_model:
    description: The decision model red-check triage, the answer gate, the finding check, the rebase check, the answer check, the fix-progress check, the edit check, the fence check, the comment check, the plan-answer check and local mode's lapse check ask with an AI Gateway key (an AI Gateway decision model id); `perplexity/pplx-decider-v1.2` when empty.
    required: false
  triage_min_confidence:
    description: 'The confidence floor, from 0 to 1, for the decision calls on `triage_model`: a verdict that acts (a flake to rerun, a red the default branch fails the same way, a rebuttal, a kept file, the answer gate''s `only_asked`, an open Question, a fix pass''s progress, a wording-only edit, the same failure, a fenced lockfile change, unread writer comments asking nothing, a plan-time Question answered or still open, a local lapse that will happen again or was transient) counts only at this confidence or more (the fence check never under 0.7). Empty: 0.7, the floor measured on `perplexity/pplx-decider-v1.2`. It is the floor of the AI Gateway''s `triage_model` only: whenever the stage''s own harness answers (no key, or after the gateway refused), the floor is 0.7. It goes with the model: a settings layer that names another `triage_model` (the default resolved) drops the floor of the layers below it, and one set lower down does not carry to another model a flag or this Action''s `triage_model` input names. The verdict, its confidence and the floor go on the progress line.'
    required: false
  drift_model:
    description: The decision model the drift advisory asks with an AI Gateway key (an AI Gateway decision model id); `baseten/elephant-1` when empty.
    required: false
  vars:
    description: 'The repository''s variables as JSON: the workflow passes toJSON of the vars context (every `uses:` step of the workflow template does). Each `PENDULUM_<NAME>` variable that names a setting sets it over the workflow''s env block, but for the settings only the reviewed workflow file sets (docs/INSTALL.md, Settings in layers); empty: no variable layer.'
    required: false
  github_token:
    description: 'The job''s GITHUB_TOKEN; Pendulum reads usage artifacts and the workflow list with it, and it never reaches the harness. Defaults to `github.token`.'
    required: false
    default: ${{ github.token }}

outputs:
  issues:
    description: (dispatch) JSON array of ready issue numbers for `strategy.matrix`.
    value: ${{ steps.run.outputs.issues }}
  count:
    description: (dispatch) How many issues are in `issues`.
    value: ${{ steps.run.outputs.count }}
  queue_watch:
    description: (dispatch) The JSON list of PRs the merge pass left in the merge queue, for the queue-watch job (`pr` in mode watch); empty when there are none.
    value: ${{ steps.run.outputs.queue_watch }}
  image_owed:
    description: (dispatch, cloud sandbox) `true` when the default branch's head is owed an image build now (an earlier day left it unbuilt and today's turn allows one), for the image job's `if:`.
    value: ${{ steps.run.outputs.image_owed }}
  wake_at:
    description: (dispatch) When the wake job ticks the dispatcher next (an ISO time), for a wait only time ends; (sweep, image) when that job's wake ticks the sweep next; empty when no wake is due or one already armed covers it.
    value: ${{ steps.run.outputs.wake_at }}
  wake_kind:
    description: (dispatch) What `wake_at` waits for, one of `lease`, `quota`, `start-retry`, `daily-cap` or `retry`; (sweep, image) `sweep`, a sweep wait of minutes.
    value: ${{ steps.run.outputs.wake_kind }}
  exit:
    description: (work, review) `delivered`, `question`, `blocked` or `skipped`; (gate) `start`, `tick` or `skipped`; (launch) `started`, `queued`, `deferred` (the stage did not start and waits for its retry time, after a transient vendor error or for a review the vendor's quota refused), `tick`, `stopped`, `token`, `skipped` or `blocked`.
    value: ${{ steps.run.outputs.exit }}
  sweep:
    description: (launch) `true` when the quota sweep a refused start ran left a sandbox for the sweep job (its usage needs that job's upload slots); the launch job's tick then runs the sweep job too.
    value: ${{ steps.run.outputs.sweep }}
  reason:
    description: (work, review) The one-line reason for a blocked or question exit.
    value: ${{ steps.run.outputs.reason }}
  pr:
    description: (work) The PR number for the branch, when one exists.
    value: ${{ steps.run.outputs.pr }}
  usd:
    description: (work) The stage's known dollars (what its harnesses and vendors reported); empty when none were reported.
    value: ${{ steps.run.outputs.usd }}
  usd_unknown:
    description: (work) How many of the stage's runs are of unknown cost (spend nobody reported, never counted in `usd` or against a cap); 0 when none.
    value: ${{ steps.run.outputs.usd_unknown }}
  issue_number:
    description: (review, gate, launch) The Objective issue number the reviewed PR or the event belongs to.
    value: ${{ steps.run.outputs.issue }}
  issue:
    description: (gate, launch) The same as `issue_number`, the name installed workflows read for the launch job's concurrency group (one per Objective).
    value: ${{ steps.run.outputs.issue }}
  start:
    description: (gate) `true` when the event starts a stage or answers a Question, for the launch job's `if:`.
    value: ${{ steps.run.outputs.start }}
  tick:
    description: (gate) `true` when CI finished on an In-review Objective's PR head with no stage waiting on it, for the merge tick job's `if:` (the dispatcher's merge pass runs); (watch) `true` when a watched PR left the merge queue, or its queue commit started no check run in time or has a required check making no progress (its running step past max(3 × that step's normal duration, it + 15 minutes), or with no history past the queue's check timeout less 10 minutes), or the watch's time is up (the dispatcher's merge pass re-enqueues a drop or a stalled entry once, or Blocks).
    value: ${{ steps.run.outputs.tick }}
  usage_name:
    description: (launch) The artifact name for `usage_dir` when a stage ended and its usage came out of the sandbox.
    value: ${{ steps.run.outputs.usage_name }}
  sandbox_id:
    description: (launch) The id of the Objective's sandbox the stage started in.
    value: ${{ steps.run.outputs.sandbox_id }}
  latency_ms:
    description: (launch) Milliseconds from the event to the stage command's start in the sandbox.
    value: ${{ steps.run.outputs.latency_ms }}
  snapshot:
    description: (image) The snapshot id the build made, empty when it skipped.
    value: ${{ steps.run.outputs.snapshot }}
  build_ms:
    description: (image) This build's milliseconds, sandbox create to snapshot.
    value: ${{ steps.run.outputs.build_ms }}
  destroyed:
    description: (sweep) How many sandboxes this run destroyed.
    value: ${{ steps.run.outputs.destroyed }}
  usage_dir_1:
    description: (sweep) A destroyed sandbox's uncollected usage, unpacked for upload as `usage_name_1`; also `_2` and `_3`.
    value: ${{ steps.run.outputs.usage_dir_1 }}
  usage_name_1:
    description: (sweep) The artifact name for `usage_dir_1`.
    value: ${{ steps.run.outputs.usage_name_1 }}
  usage_dir_2:
    description: (sweep) See `usage_dir_1`.
    value: ${{ steps.run.outputs.usage_dir_2 }}
  usage_name_2:
    description: (sweep) See `usage_name_1`.
    value: ${{ steps.run.outputs.usage_name_2 }}
  usage_dir_3:
    description: (sweep) See `usage_dir_1`.
    value: ${{ steps.run.outputs.usage_dir_3 }}
  usage_name_3:
    description: (sweep) See `usage_name_1`.
    value: ${{ steps.run.outputs.usage_name_3 }}
  account:
    description: "(account) The account the job's stage runs on, for the next step's `account` input and its credential inputs, which name each declared account's secret and pass this one's alone; `-` when none can be picked, empty when the workflow was rendered for other accounts (the stage then holds no credential, and Blocks or waits with why)."
    value: ${{ steps.run.outputs.account }}
  usage_dir:
    description: (work, review) The directory to upload as `pendulum-usage-<issue>`, the usage record `result.json` with the event stream and saved sessions sealed in `transcript.sealed` (or readable, on a private repository or with `publish_transcripts`); (launch) an ended sandbox stage's, named by `usage_name`.
    value: ${{ steps.run.outputs.usage_dir }}

runs:
  using: composite
  steps:
    # The ref the workflow's `uses:` names for this action, read before any nested `uses:` below can leave
    # github.action_ref empty or set to its own (actions/runner#2473): the Pendulum build its records name
    # (release.mjs pendulumBuild).
    - name: Pendulum's ref
      id: pendulum-ref
      shell: bash
      env:
        REF: ${{ github.action_ref }}
      run: printf 'ref=%s\n' "${REF//[$'\r\n']/}" >> "$GITHUB_OUTPUT"

    - name: Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node_version || env.PENDULUM_NODE_VERSION || '22' }}

    # The harness an Objective's `pendulum:harness:<name>` label names (scripts/objective-harness.mjs), read with the job's
    # own token: the job installs that CLI. The stage checks who applied the label, and Blocks when the harness it runs on
    # is not the one installed here (PENDULUM_STAGE_HARNESS below).
    - name: The Objective's harness
      id: choice
      if: inputs.mode == 'work' || inputs.mode == 'review'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PENDULUM_INPUT_ISSUE: ${{ inputs.issue }}
      # A review job's issue is its PR's branch's (GITHUB_HEAD_REF on a pull_request event): no API call for the PR.
      run: node "$GITHUB_ACTION_PATH/plugin/scripts/objective-harness.mjs" --repo "$GITHUB_REPOSITORY" --issue "${PENDULUM_INPUT_ISSUE:-0}" --branch "${GITHUB_HEAD_REF:-none}"

    - name: Install the harness CLI
      id: install
      if: inputs.mode != 'dispatch' && inputs.mode != 'launch' && inputs.mode != 'gate' && inputs.mode != 'image' && inputs.mode != 'watch' && inputs.mode != 'account'
      shell: bash
      # The harness comes from the Objective's harness label when it names one, else `with:` when given, else the
      # repository's PENDULUM_HARNESS variable, else the workflow's PENDULUM_HARNESS env block (visible to composite steps at
      # runtime), else claude: the same precedence as lib/choice.mjs chosenInputs over lib/inputs.mjs. Its version:
      # lib/choice.mjs harnessVersionFor.
      env:
        PENDULUM_CHOSEN_HARNESS: ${{ steps.choice.outputs.harness }}
        PENDULUM_INPUT_HARNESS: ${{ inputs.harness }}
        PENDULUM_VARIABLE_HARNESS: ${{ fromJSON(inputs.vars || '{}').PENDULUM_HARNESS }}
        PENDULUM_INPUT_HARNESS_VERSION: ${{ inputs.harness_version }}
      run: |
        # A harness name as lib/inputs.mjs reads it: the outer whitespace trimmed, lower case. A variable's is taken only
        # when it names a harness, as inputs.mjs takes it (valueProblem); anything else falls through to the workflow's.
        name() { local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v" | tr '[:upper:]' '[:lower:]'; }
        WORKFLOW_HARNESS="$(name "${PENDULUM_HARNESS:-}")"; WORKFLOW_HARNESS="${WORKFLOW_HARNESS:-claude}"
        VARIABLE_HARNESS="$(name "${PENDULUM_VARIABLE_HARNESS:-}")"
        case "$VARIABLE_HARNESS" in claude|codex|copilot) ;; *) VARIABLE_HARNESS="" ;; esac
        DEFAULT_HARNESS="$(name "${PENDULUM_INPUT_HARNESS:-${VARIABLE_HARNESS:-$WORKFLOW_HARNESS}}")"
        HARNESS="$(name "${PENDULUM_CHOSEN_HARNESS:-$DEFAULT_HARNESS}")"
        VERSION="${PENDULUM_INPUT_HARNESS_VERSION:-${PENDULUM_HARNESS_VERSION:-latest}}"
        # harness_version pins the workflow env block's harness only: another one (an Objective's label's, a run's override's, a repository variable's) installs its latest.
        if [ "$HARNESS" != "$WORKFLOW_HARNESS" ]; then VERSION=latest; fi
        # Claude Code's postinstall puts its native binary in place (without it `claude` is a stub that exits 1); npm 11
        # asks for each package's scripts to be allowed by name, and this allows that one package's only.
        case "$HARNESS" in
          claude)  npm install -g --allow-scripts=@anthropic-ai/claude-code "@anthropic-ai/claude-code@${VERSION}" ;;
          codex)   npm install -g "@openai/codex@${VERSION}" ;;
          copilot) npm install -g "@github/copilot@${VERSION}" ;;
          *) echo "unknown harness $HARNESS" >&2; exit 1 ;;
        esac
        # Every harness runs its commands in its own bubblewrap sandbox here (docs/PLAN.md, Credentials and billing):
        # bubblewrap for all three, socat for all three (the gateway relay's forwarder,
        # docs/PLAN.md), ripgrep for Claude Code, slirp4netns for Copilot (its sandbox's network).
        # Ubuntu's AppArmor keeps unprivileged user namespaces from bwrap: a profile grants them to /usr/bin/bwrap alone
        # (not the sysctl, which lifts it for every program), and Ubuntu 26.04's bwrap-userns-restrict profile, which
        # takes the capabilities its sandbox needs, is unloaded when loaded. Copilot's sandbox makes its namespaces with
        # util-linux unshare, which bubblewrap then joins: for Copilot the profile is for /usr/bin/unshare instead. Only on
        # GitHub's hosted runners, which are thrown away after the job: on a self-hosted runner these would outlast it
        # and change the whole host, so doctor names the one-time admin step instead.
        case "$HARNESS" in claude) PKGS="bubblewrap socat ripgrep" ;; codex) PKGS="bubblewrap socat" ;; copilot) PKGS="bubblewrap slirp4netns socat" ;; *) PKGS="" ;; esac
        if [ -n "$PKGS" ] && [ "$RUNNER_OS" = Linux ] && [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ] && command -v apt-get >/dev/null && sudo -n true 2>/dev/null; then
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $PKGS >/dev/null || { sudo -n apt-get update -qq && sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $PKGS >/dev/null; } || echo "::warning::$PKGS did not install; doctor names what is missing"
          if [ -d /sys/kernel/security/apparmor ]; then
            if sudo -n grep -q '^unpriv_bwrap ' /sys/kernel/security/apparmor/profiles; then sudo -n apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict || echo "::warning::bwrap-userns-restrict could not be unloaded"; fi
            if [ "$HARNESS" = copilot ]; then
              # Copilot's bwrap joins the namespaces unshare made, so only unshare needs the grant (and, on Ubuntu 25.04
              # and later, its unshare-userns-restrict profile unloaded, as bwrap-userns-restrict above).
              if sudo -n grep -q '^unpriv_unshare ' /sys/kernel/security/apparmor/profiles; then sudo -n apparmor_parser -R /etc/apparmor.d/unshare-userns-restrict || echo "::warning::unshare-userns-restrict could not be unloaded"; fi
              printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile pendulum-unshare /usr/bin/unshare flags=(unconfined) {\n  userns,\n}\n' | sudo -n tee /etc/apparmor.d/pendulum-unshare >/dev/null
              sudo -n apparmor_parser -r /etc/apparmor.d/pendulum-unshare || echo "::warning::the AppArmor profile for unshare did not load; copilot refuses to start where its sandbox cannot"
            else
              printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile pendulum-bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\n' | sudo -n tee /etc/apparmor.d/pendulum-bwrap >/dev/null
              sudo -n apparmor_parser -r /etc/apparmor.d/pendulum-bwrap || echo "::warning::the AppArmor profile for bwrap did not load; $HARNESS refuses to start where its sandbox cannot"
            fi
          fi
        fi
        "$HARNESS" --version
        echo "harness=$HARNESS" >> "$GITHUB_OUTPUT"

    # The sandbox modes alone load a vendor SDK (lib/adapters): installed from plugin/package-lock.json, exactly as
    # pinned, with no package's install scripts run. The launcher starts the same install itself (launch.mjs
    # installAdapter), beside its GitHub reads, so a launch does not wait for it first. The other modes need none.
    - name: Install the sandbox adapter
      if: inputs.mode == 'image' || inputs.mode == 'sweep'
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH/plugin"

    - name: Run pendulum (${{ inputs.mode }})
      id: run
      shell: bash
      # Inputs reach the scripts as PENDULUM_INPUT_*; an empty `with:` value falls
      # through to the workflow's PENDULUM_* env block (a repository variable of the
      # same name over it, lib/inputs.mjs applyVariables), then to the script default.
      # The Codex key is set here, on this one step, and the script passes it to the
      # harness child only; validation commands and git hooks never see it.
      env:
        PENDULUM_INPUT_MODE: ${{ inputs.mode }}
        PENDULUM_INPUT_ISSUE: ${{ inputs.issue }}
        PENDULUM_INPUT_PR: ${{ inputs.pr }}
        PENDULUM_INPUT_HARNESS: ${{ inputs.harness }}
        PENDULUM_INPUT_MODEL: ${{ inputs.model }}
        PENDULUM_INPUT_SUBAGENT_MODEL: ${{ inputs.subagent_model }}
        PENDULUM_INPUT_REVIEWER_MODEL: ${{ inputs.reviewer_model }}
        PENDULUM_INPUT_REVIEWER_EFFORT: ${{ inputs.reviewer_effort }}
        PENDULUM_INPUT_EFFORT: ${{ inputs.effort }}
        PENDULUM_INPUT_COMPACTION_WINDOW: ${{ inputs.compaction_window }}
        PENDULUM_INPUT_PROMPT_CACHE_TTL: ${{ inputs.prompt_cache_ttl }}
        PENDULUM_INPUT_ALLOWED_DOMAINS: ${{ inputs.allowed_domains }}
        PENDULUM_INPUT_RESUME_POLICY: ${{ inputs.resume_policy }}
        PENDULUM_INPUT_PUBLISH_TRANSCRIPTS: ${{ inputs.publish_transcripts }}
        PENDULUM_INPUT_SIBLING_HOLD: ${{ inputs.sibling_hold }}
        PENDULUM_INPUT_DECISION_ROUTE: ${{ inputs.decision_route }}
        PENDULUM_INPUT_CREDENTIAL: ${{ inputs.credential }}
        PENDULUM_INPUT_MAX_CONCURRENT: ${{ inputs.max_concurrent }}
        PENDULUM_INPUT_REBASE_LIMIT: ${{ inputs.rebase_limit }}
        PENDULUM_INPUT_GUESS_HOURS: ${{ inputs.guess_hours }}
        PENDULUM_INPUT_DAILY_USD: ${{ inputs.daily_usd }}
        PENDULUM_INPUT_MAX_USD: ${{ inputs.max_usd }}
        PENDULUM_INPUT_MAX_OBJECTIVE_USD: ${{ inputs.max_objective_usd }}
        PENDULUM_INPUT_COPILOT_CREDIT_USD: ${{ inputs.copilot_credit_usd }}
        PENDULUM_INPUT_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        PENDULUM_INPUT_AUTO_MERGE: ${{ inputs.auto_merge }}
        PENDULUM_INPUT_NOTIFY: ${{ inputs.notify }}
        PENDULUM_INPUT_MAINTAINERS: ${{ inputs.maintainers }}
        PENDULUM_INPUT_SETUP: ${{ inputs.setup }}
        PENDULUM_INPUT_INSTALL: ${{ inputs.install }}
        PENDULUM_INPUT_VALIDATION: ${{ inputs.validation }}
        PENDULUM_INPUT_BUDGET_COMMAND: ${{ inputs.budget_command }}
        PENDULUM_INPUT_PROTECTED_PATHS: ${{ inputs.protected_paths }}
        PENDULUM_INPUT_TOOLCHAIN_PATHS: ${{ inputs.toolchain_paths }}
        PENDULUM_INPUT_CI_CHECKS: ${{ inputs.ci_checks }}
        PENDULUM_INPUT_THIRD_PARTY_REVIEWERS: ${{ inputs.third_party_reviewers }}
        PENDULUM_INPUT_THIRD_PARTY_WAIT_MINUTES: ${{ inputs.third_party_wait_minutes }}
        PENDULUM_INPUT_CROSS_OS_WORKFLOW: ${{ inputs.cross_os_workflow }}
        PENDULUM_INPUT_CROSS_OS_CHECKS: ${{ inputs.cross_os_checks }}
        PENDULUM_INPUT_CROSS_OS_WAIT_MINUTES: ${{ inputs.cross_os_wait_minutes }}
        PENDULUM_INPUT_APP_ID: ${{ inputs.app_id }}
        PENDULUM_INPUT_APP_PRIVATE_KEY: ${{ inputs.app_private_key }}
        PENDULUM_INPUT_ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        PENDULUM_INPUT_ANTHROPIC_OIDC_EXCHANGE_URL: ${{ inputs.anthropic_oidc_exchange_url }}
        PENDULUM_INPUT_CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        PENDULUM_INPUT_CODEX_API_KEY: ${{ inputs.codex_api_key }}
        PENDULUM_INPUT_CODEX_GATEWAY_KEY: ${{ inputs.codex_gateway_key }}
        PENDULUM_INPUT_COPILOT_GITHUB_TOKEN: ${{ inputs.copilot_github_token }}
        PENDULUM_INPUT_AI_GATEWAY_API_KEY: ${{ inputs.ai_gateway_api_key }}
        PENDULUM_INPUT_WORKER_SECRETS: ${{ inputs.worker_secrets }}
        PENDULUM_INPUT_WORKER_SECRET_VALUES: ${{ inputs.worker_secret_values }}
        PENDULUM_INPUT_TRIAGE_MODEL: ${{ inputs.triage_model }}
        PENDULUM_INPUT_TRIAGE_MIN_CONFIDENCE: ${{ inputs.triage_min_confidence }}
        PENDULUM_INPUT_DRIFT_MODEL: ${{ inputs.drift_model }}
        PENDULUM_INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        # The repository's variables (lib/inputs.mjs applyVariables lays them over the env block, then drops this).
        PENDULUM_INPUT_VARS: ${{ inputs.vars }}
        PENDULUM_INPUT_SANDBOX: ${{ inputs.sandbox }}
        PENDULUM_INPUT_VERCEL_TOKEN: ${{ inputs.vercel_token }}
        PENDULUM_INPUT_VERCEL_TEAM_ID: ${{ inputs.vercel_team_id }}
        PENDULUM_INPUT_VERCEL_PROJECT_ID: ${{ inputs.vercel_project_id }}
        PENDULUM_INPUT_IMAGE_REFRESH: ${{ inputs.image_refresh }}
        PENDULUM_INPUT_IMAGE_DAILY_MINUTES: ${{ inputs.image_daily_minutes }}
        PENDULUM_INPUT_IMAGE_MAX_AGE_DAYS: ${{ inputs.image_max_age_days }}
        PENDULUM_INPUT_IMAGE_OWED: ${{ inputs.image_owed }}
        PENDULUM_INPUT_SANDBOX_IDLE_DAYS: ${{ inputs.sandbox_idle_days }}
        PENDULUM_INPUT_SWEEP_MAX_DESTROYS: ${{ inputs.sweep_max_destroys }}
        PENDULUM_INPUT_USAGE_LIMIT_WAITS: ${{ inputs.usage_limit_waits }}
        PENDULUM_INPUT_USAGE_LIMIT_MOVE_MINUTES: ${{ inputs.usage_limit_move_minutes }}
        PENDULUM_INPUT_CLAIM_PAUSE_HOURS: ${{ inputs.claim_pause_hours }}
        PENDULUM_INPUT_SIBLING_WAIT_HOURS: ${{ inputs.sibling_wait_hours }}
        PENDULUM_INPUT_MAX_PARTS: ${{ inputs.max_parts }}
        PENDULUM_INPUT_STEP_STALL_FACTOR: ${{ inputs.step_stall_factor }}
        PENDULUM_INPUT_STEP_STALL_FLOOR_MINUTES: ${{ inputs.step_stall_floor_minutes }}
        PENDULUM_INPUT_QUEUE_STALL_MINUTES: ${{ inputs.queue_stall_minutes }}
        # The harness the install step put in place (empty for the modes that install none): a stage that would run another Blocks.
        PENDULUM_STAGE_HARNESS: ${{ steps.install.outputs.harness }}
        # The account the job's account step picked (#267), whose credential alone the workflow passed: a stage whose labels pick another Blocks.
        PENDULUM_STAGE_ACCOUNT: ${{ inputs.account }}
        # The accounts setup rendered the credential inputs for (account mode): another declaration picks no account.
        PENDULUM_RENDERED_ACCOUNTS: ${{ inputs.rendered_accounts }}
        PENDULUM_USAGE_DIR: ${{ runner.temp }}/pendulum-usage
        # The scripts, skills, agents and task card are one tree: the plugin beside this action.
        PENDULUM_PLUGIN_ROOT: ${{ github.action_path }}/plugin
        # The ref the workflow's uses: names for this action, as the first step read it: the build its records name.
        PENDULUM_ACTION_REF: ${{ steps.pendulum-ref.outputs.ref }}
      run: |
        set -euo pipefail
        # The launcher sets its own (an ended sandbox stage's usage, or none). Work and review upload the directory the next
        # step fills from the stage's (never the stage's own), so a stage cut off before that step uploads nothing of its stream.
        case "$PENDULUM_INPUT_MODE" in work|review) echo "usage_dir=$RUNNER_TEMP/pendulum-upload" >> "$GITHUB_OUTPUT" ;; esac
        mkdir -p "$PENDULUM_USAGE_DIR"
        # Work and review replace this shell (exec): a cancelled job's SIGINT and SIGTERM go to the step's process alone,
        # which a shell waiting on its child never passes on, so the stage gets them and writes its usage record first.
        case "$PENDULUM_INPUT_MODE" in
          dispatch) node "$PENDULUM_PLUGIN_ROOT/scripts/dispatch.mjs" --repo "$GITHUB_REPOSITORY" ;;
          work)     exec node "$PENDULUM_PLUGIN_ROOT/scripts/worker.mjs" --repo "$GITHUB_REPOSITORY" --issue "$PENDULUM_INPUT_ISSUE" --checkout "$GITHUB_WORKSPACE" --usage-dir "$PENDULUM_USAGE_DIR" ;;
          review)   exec node "$PENDULUM_PLUGIN_ROOT/scripts/review.mjs" --repo "$GITHUB_REPOSITORY" --pr "$PENDULUM_INPUT_PR" --checkout "$GITHUB_WORKSPACE" --usage-dir "$PENDULUM_USAGE_DIR" ;;
          gate)     node "$PENDULUM_PLUGIN_ROOT/scripts/launch.mjs"   --repo "$GITHUB_REPOSITORY" --gate ;;
          launch)   PENDULUM_ADAPTER_INSTALL=1 node "$PENDULUM_PLUGIN_ROOT/scripts/launch.mjs" --repo "$GITHUB_REPOSITORY" ;;
          image)    node "$PENDULUM_PLUGIN_ROOT/scripts/image.mjs"    --repo "$GITHUB_REPOSITORY" --checkout "$GITHUB_WORKSPACE" ;;
          sweep)    node "$PENDULUM_PLUGIN_ROOT/scripts/sweep.mjs"    --repo "$GITHUB_REPOSITORY" ;;
          watch)    node "$PENDULUM_PLUGIN_ROOT/scripts/dispatch.mjs" --repo "$GITHUB_REPOSITORY" --watch "${PENDULUM_INPUT_PR:-[]}" ;;
          account)  node "$PENDULUM_PLUGIN_ROOT/scripts/objective-account.mjs" --repo "$GITHUB_REPOSITORY" --issue "${PENDULUM_INPUT_ISSUE:-0}" --branch "${GITHUB_HEAD_REF:-none}" ;;
          *) echo "mode must be dispatch, work, review, gate, launch, image, sweep, watch or account" >&2; exit 1 ;;
        esac

    # The usage artifact the job uploads (`usage_dir`), whatever the stage's outcome: the usage record and the stage's
    # files, with the harness's event stream and saved sessions sealed unless the repository is private or
    # publish_transcripts is on (scripts/usage-upload.mjs, lib/seal.mjs).
    - name: Seal the usage artifact
      if: always() && (inputs.mode == 'work' || inputs.mode == 'review')
      shell: bash
      env:
        PENDULUM_INPUT_APP_PRIVATE_KEY: ${{ inputs.app_private_key }}
        PENDULUM_INPUT_PUBLISH_TRANSCRIPTS: ${{ inputs.publish_transcripts }}
        PENDULUM_INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        # What the sealed file is bound to: the Objective (the review job's, from its PR's branch) and the stage.
        PENDULUM_INPUT_ISSUE: ${{ steps.run.outputs.issue || inputs.issue }}
        PENDULUM_INPUT_MODE: ${{ inputs.mode }}
      run: node "$GITHUB_ACTION_PATH/plugin/scripts/usage-upload.mjs" --repo "$GITHUB_REPOSITORY" --issue "$PENDULUM_INPUT_ISSUE" --stage "$PENDULUM_INPUT_MODE" --from "$RUNNER_TEMP/pendulum-usage" --to "$RUNNER_TEMP/pendulum-upload"
