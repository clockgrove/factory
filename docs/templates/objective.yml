name: Objective
description: A result for Factory to plan, build, validate and deliver
title: "Objective: "
type: Feature
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: One paragraph — what changes, for whom, and what is out of scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: One observable fact per bullet. A bullet that is exactly one backticked command means that command must pass on the integrated result.
      value: |
        - `npm test`
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Repository files, one per bullet, or path#Exact Heading for one section. Workers get them verbatim.
      value: |
        - README.md
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Non-goals and limits, such as no deployment or no new dependencies.
  - type: textarea
    id: workspace-package-additions
    attributes:
      label: Workspace package additions
      description: Optional. Only when adding packages to an existing pnpm-workspace.yaml. One exact backticked package directory per bullet.
      placeholder: "- `packages/example`"
  - type: textarea
    id: package-manager-update
    attributes:
      label: Package manager update
      description: Optional. Refresh an existing exact stable npm or pnpm packageManager pin. Exactly one backticked pin in one bullet, using the same manager. Scripts, hooks and security configuration stay fixed.
      placeholder: "- `pnpm@10.34.5`"
