name: Objective
description: A result for Factory to plan, build, validate and deliver
title: "Objective: "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: One paragraph — what changes, for whom, and what is out of scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: One observable fact per bullet. Include any constraint that must be verified.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: final-validation
    attributes:
      label: Final validation
      description: Exact commands, one per bullet, that must pass on the integrated result.
      value: |
        - `npm test`
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Non-goals and limits, such as no deployment or no new dependencies.
  - type: textarea
    id: required-checks
    attributes:
      label: Required checks
      description: Optional. Exact CI check names, one per bullet, that are not jobs in the repository's workflows.
  - type: textarea
    id: planning-sources
    attributes:
      label: Planning sources
      description: Repository files, one per bullet, or path#Exact Heading for one section.
      value: |
        - README.md
    validations:
      required: true
