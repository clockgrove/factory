name: Objective
description: A result for Factory to plan, build, validate and deliver
title: "Objective: "
type: Feature
body:
  - type: textarea
    id: outcome
    attributes:
      label: Goal
      description: One paragraph — what changes, for whom, and what is out of scope. A goal paragraph from a PRD works as is.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: One observable fact per bullet. A command the result must pass is a fact too, such as "`npm test` passes"; the plan runs it unchanged on the integrated result.
      value: |
        - `npm test` passes.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Optional prose and links, such as PRD sections, issues or design notes. The planner reads the repository itself.
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Optional. Only repository files every worker must receive verbatim, one per bullet ("- path" or "- path#Exact Heading").
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Non-goals and limits, such as no deployment or no new dependencies.
  - type: textarea
    id: workspace-package-additions
    attributes:
      label: Workspace package additions
      description: Optional. Only when adding packages to an existing pnpm-workspace.yaml. One exact backticked package directory per bullet.
      placeholder: "- `packages/example`"
  - type: textarea
    id: package-manager-update
    attributes:
      label: Package manager update
      description: Optional. Refresh an existing exact stable npm or pnpm packageManager pin. Exactly one backticked pin in one bullet, using the same manager. Scripts, hooks and security configuration stay fixed.
      placeholder: "- `pnpm@10.34.5`"
