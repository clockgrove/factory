# Factory: unattended Objectives. Written by `/factory setup`; edit the env block, not the jobs.
# Triggers: cron, manual (one issue), a new factory:objective label, the review job's own last step, and
# pull_request when the Factory App labels a PR factory:review. Never from a fork: the Objective text (a writer) and the label (a
# maintainer) are the only inputs. FACTORY_AUTO_MERGE is ON: Factory merges the reviewed head with
# no human read. The gate is your CI workflow's checks on that exact head (and the merge queue's
# commit), the comment-only reviewer pass, and the queue's own re-run. Set it false for ready PRs.
name: factory
on:
  schedule:
    - cron: "*/10 * * * *"
    # {{#sandbox}}
    - cron: "41 10 * * *" # the nightly sandbox image build (the image job)
    - cron: "17 * * * *" # the hourly sandbox sweep (the sweep job)
    # {{/sandbox}}
  workflow_dispatch:
    inputs:
      issue: { description: Objective issue number (empty runs the dispatcher), required: false }
      harness: { description: "Override FACTORY_HARNESS for this run (claude | codex | copilot)", required: false }
      # {{#sandbox}}
      image: { description: "true builds the sandbox image from the default branch now", required: false }
      sweep: { description: "true runs the sandbox sweep now", required: false }
      # {{/sandbox}}
  issues: # a new Objective dispatches at once (labelled at creation, or labelled later); the cron is only the sweep
    # {{^sandbox}}
    types: [opened, labeled]
    # {{/sandbox}}
    # {{#sandbox}}
    types: [opened, labeled, closed] # closed: the sandbox sweep destroys the Objective's sandbox
    # {{/sandbox}}
  pull_request: # fires because the App (not the job token) applies factory:review, a human marks a Question draft ready, a Factory PR merged (siblings may be stale now), or the merge queue dropped one (the dispatcher re-enqueues it once, then Blocks)
    types: [labeled, ready_for_review, closed, dequeued]
  # {{#sandbox}}
  push: # a merge to the default branch refreshes the sandbox image (the image job)
    branches:
      - {{default_branch}}
  repository_dispatch: # factory-stage: a stage in its sandbox asks for fresh tokens, or says it ended (only Factory's App sends these)
    types: [factory-stage]
  issue_comment: # a maintainer's comment on an Objective: the answer to its Question
    types: [created]
  # {{/sandbox}}
  check_suite: # CI from a GitHub App outside Actions finished on a factory/ branch: a stage waiting on it resumes, or the dispatcher's merge pass runs
    types: [completed]
  workflow_run: # CI on Actions finished (GitHub sends no check_suite event for a suite Actions made)
    workflows:
      - {{ci_workflow}}
    types: [completed]
env:
  FACTORY_HARNESS: {{harness}} # claude | codex | copilot
  FACTORY_MODEL: {{model}}
  FACTORY_SUBAGENT_MODEL: {{subagent_model}}
  FACTORY_REVIEWER_MODEL: {{reviewer_model}}
  FACTORY_CREDENTIAL: {{credential}} # api; plan only for your own repository
  FACTORY_MAX_CONCURRENT: {{max_concurrent}}
  FACTORY_DAILY_USD: {{daily_usd}}
  FACTORY_MAX_USD: {{max_usd}}
  FACTORY_TIMEOUT_MINUTES: {{timeout_minutes}} # under 360 on hosted runners; mirrored in timeout-minutes below
  FACTORY_AUTO_MERGE: {{auto_merge}}
  FACTORY_NOTIFY: {{notify}} # login#id: the id pins the account (setup writes it)
  FACTORY_SETUP: {{setup}}
  FACTORY_INSTALL: {{install}} # auto (from the lockfile), none, or your own command
  FACTORY_VALIDATION: {{validation}}
  FACTORY_BUDGET_COMMAND: {{budget_command}}
  FACTORY_PROTECTED_PATHS: {{protected_paths}}
  FACTORY_CI_CHECKS: {{ci_checks}}
  FACTORY_NODE_VERSION: {{node_version}} # the Node.js your CI uses
  # {{#sandbox}}
  FACTORY_SANDBOX: {{sandbox}} # each stage runs in the Objective's cloud sandbox, started by a launch job; re-run setup to change
  FACTORY_SANDBOX_VCPUS: {{sandbox_vcpus}} # the sandbox's size (2 GB of memory per vCPU on Vercel); set it from your own capacity test
  FACTORY_IMAGE_REFRESH: {{image_refresh}} # merge: rebuild the sandbox image on each merge until the minutes below, then nightly; nightly: only nightly
  FACTORY_IMAGE_DAILY_MINUTES: {{image_daily_minutes}} # image build minutes a day on merges
  FACTORY_SANDBOX_IDLE_DAYS: {{sandbox_idle_days}} # the sweep destroys a sandbox stopped this long, its Objective neither Running nor In review
  FACTORY_SWEEP_MAX_DESTROYS: {{sweep_max_destroys}} # sandboxes one sweep run destroys at most
  # {{/sandbox}}
permissions: # the job token reads code and Actions; every write goes through the App's token
  contents: read
  actions: read # the dispatcher sums today's usage artifacts; doctor lists the CI workflow's triggers
  issues: write
  # id-token: write         # Claude workload identity federation only
jobs:
  dispatch:
    # Ticks: the cron, a manual run, a new Objective's label, the review job's last step (a worker slot freed), a merged
    # Factory PR, the merge queue dropping one (only GitHub and people with write access dequeue), the queue watch, and,
    # without a sandbox, CI finishing on a factory/ branch (the merge pass merges a PR whose checks just went green; with
    # a sandbox the gate job takes those events and ticks this job itself).
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && (github.event.label.name == 'factory:objective' || (github.event.action == 'opened' && contains(join(github.event.issue.labels.*.name, ','), 'factory:objective')))) ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && startsWith(github.head_ref, 'factory/')) ||
      (github.event_name == 'pull_request' && github.event.action == 'dequeued' && startsWith(github.head_ref, 'factory/') && github.event.pull_request.head.repo.full_name == github.repository)
      # {{^sandbox}}
      || (github.event_name == 'check_suite' && startsWith(github.event.check_suite.head_branch, 'factory/')) ||
      (github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'factory/') && github.event.workflow_run.head_repository.full_name == github.repository)
      # {{/sandbox}}
    concurrency: { group: factory-dispatch, cancel-in-progress: false } # ticks run one at a time
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a tick takes seconds; a hung one would hold every later tick for the runner's six hours
    outputs: { issues: "${{ steps.f.outputs.issues }}", count: "${{ steps.f.outputs.count }}", queue_watch: "${{ steps.f.outputs.queue_watch }}" }
    steps:
      - uses: {{action}}
        id: f
        with: { mode: dispatch, issue: "${{ inputs.issue }}", app_id: "${{ secrets.FACTORY_APP_ID }}", app_private_key: "${{ secrets.FACTORY_APP_PRIVATE_KEY }}" }
  queue-watch:
    # The PRs the merge pass left in the merge queue: this job reads each entry every 30 s until it leaves the queue,
    # then ticks the dispatcher, whose merge pass re-enqueues a dropped PR once, then Blocks. The tick is this job's own
    # workflow_dispatch, which GitHub never holds for approval; the `dequeued` event's run can be held (the queue's bot
    # counts as an outside contributor under a strict approval policy). A queue commit that starts no check in 10
    # minutes, or whose required check makes no progress (its running step past max(3 x that step's normal duration,
    # it + 15 min), read from recent green runs with this job's actions: read; runner wait never counts), ticks it
    # too: the merge pass takes the PR out and puts it back once (CI restarts), then Blocks. Past 12 minutes the watch
    # ticks anyway and the dispatcher starts a new one. One watch runs at a time; a newer one waits.
    name: queue watch
    needs: dispatch
    if: needs.dispatch.outputs.queue_watch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read, actions: write } # actions: write only for the dispatcher tick
    concurrency: { group: factory-queue-watch, cancel-in-progress: false }
    steps:
      - uses: {{action}}
        id: w
        with: { mode: watch, pr: "${{ needs.dispatch.outputs.queue_watch }}", app_id: "${{ secrets.FACTORY_APP_ID }}", app_private_key: "${{ secrets.FACTORY_APP_PRIVATE_KEY }}" }
      - name: Dispatch tick (a watched PR left the queue or stalled there, or the watch's time is up)
        if: steps.w.outputs.tick == 'true'
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" } # no checkout here: gh names the repository from GH_REPO
        run: gh workflow run factory.yml
  # {{^sandbox}}
  work:
    needs: dispatch
    if: needs.dispatch.outputs.count != '' && needs.dispatch.outputs.count != '0'
    runs-on: {{runs_on}}
    timeout-minutes: {{timeout_minutes}}
    strategy: { max-parallel: {{max_concurrent}}, fail-fast: false, matrix: { issue: "${{ fromJSON(needs.dispatch.outputs.issues) }}" } }
    permissions: { contents: read, issues: write, actions: write } # actions: write for the tick at the end and triage's rerun of failed CI jobs
    concurrency: { group: "factory-${{ matrix.issue }}", cancel-in-progress: false } # one job per issue; a repeat waits, siblings keep running
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: {{action}}
        id: f
        with:
          mode: work
          issue: ${{ matrix.issue }}
          harness: ${{ inputs.harness }} # empty falls through to FACTORY_HARNESS
          app_id: ${{ secrets.FACTORY_APP_ID }}
          app_private_key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} # Claude; empty with federation
          codex_api_key: ${{ secrets.CODEX_API_KEY }} # Codex; reaches the harness step only
          copilot_github_token: ${{ secrets.COPILOT_GITHUB_TOKEN }} # Copilot; a token with only the Copilot Requests permission (required)
          ai_gateway_api_key: ${{ secrets.AI_GATEWAY_API_KEY }} # optional: red-check triage reruns flaky CI jobs instead of a fix pass, and the drift advisory flags a drifting worker on its progress comment; empty turns both off
          # anthropic_oidc_exchange_url: ${{ vars.ANTHROPIC_OIDC_EXCHANGE_URL }} # Claude federation (with id-token: write above)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} # credential: plan only; your own repository only
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "factory-usage-${{ matrix.issue }}", path: "${{ steps.f.outputs.usage_dir }}", retention-days: 90 }
      - name: Dispatch tick (this worker finished; a conflicting PR fires no review job)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run factory.yml || true
  review:
    name: review (${{ github.head_ref }})
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'factory/') && github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'labeled' && github.event.label.name == 'factory:review') || github.event.action == 'ready_for_review')
    runs-on: {{runs_on}}
    timeout-minutes: {{timeout_minutes}}
    permissions: { contents: read, issues: write, actions: write } # actions: write here, for the tick below and triage's rerun of failed CI jobs
    concurrency: { group: "factory-review-${{ github.event.pull_request.number }}", cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: {{action}}
        id: f
        with:
          mode: review
          pr: ${{ github.event.pull_request.number }}
          harness: ${{ inputs.harness }}
          app_id: ${{ secrets.FACTORY_APP_ID }}
          app_private_key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          codex_api_key: ${{ secrets.CODEX_API_KEY }}
          copilot_github_token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          ai_gateway_api_key: ${{ secrets.AI_GATEWAY_API_KEY }}
          # anthropic_oidc_exchange_url: ${{ vars.ANTHROPIC_OIDC_EXCHANGE_URL }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: always() && steps.f.outputs.issue_number != ''
        with: { name: "factory-usage-${{ steps.f.outputs.issue_number }}-review", path: "${{ steps.f.outputs.usage_dir }}", retention-days: 90, overwrite: true } # one name per review run; the bench lists it exactly
      - name: Dispatch tick (a worker slot freed)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run factory.yml || true
  # {{/sandbox}}
  # {{#sandbox}}
  launch:
    # The dispatcher's picks and its sweep's re-launches: each one's stage starts in its sandbox; this job starts it and exits.
    name: launch (${{ matrix.issue }})
    needs: dispatch
    if: needs.dispatch.outputs.count != '' && needs.dispatch.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy: { fail-fast: false, matrix: { issue: "${{ fromJSON(needs.dispatch.outputs.issues) }}" } }
    permissions: { contents: read, actions: read } # the job token reads usage artifacts and this run; every write is the App's
    concurrency: { group: "factory-launch-factory/${{ matrix.issue }}", cancel-in-progress: false } # one launcher per Objective at a time, with launch-event's
    steps:
      - uses: {{action}}
        id: f
        with:
          mode: launch
          issue: ${{ matrix.issue }}
          harness: ${{ inputs.harness }} # empty falls through to FACTORY_HARNESS
          app_id: ${{ secrets.FACTORY_APP_ID }}
          app_private_key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_team_id: ${{ secrets.VERCEL_TEAM_ID }}
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} # the harness's credential goes into the stage's environment only
          codex_api_key: ${{ secrets.CODEX_API_KEY }}
          copilot_github_token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} # credential: plan only; your own repository only
          ai_gateway_api_key: ${{ secrets.AI_GATEWAY_API_KEY }}
      - uses: actions/upload-artifact@v7
        if: always() && steps.f.outputs.usage_dir != ''
        with: { name: "${{ steps.f.outputs.usage_name }}", path: "${{ steps.f.outputs.usage_dir }}", retention-days: 90, overwrite: true } # an earlier stage's usage whose end was never answered
  launch-gate:
    # An event on one Objective: a maintainer's comment, finished CI on its branch, its PR labelled for review or marked
    # ready, its stage asking for tokens or saying it ended. The gate decides in no concurrency group, so an event that starts nothing (a stranger's comment, a fork's
    # CI) never queues in the Objective's group, where it would replace a pending launch. No SDK install here.
    name: launch gate (${{ github.event_name }})
    if: >-
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request && github.event.comment.user.type != 'Bot' &&
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.comment.author_association) || contains(fromJSON('[{{maintainer_ids}}]'), github.event.comment.user.id)) &&
       !startsWith(github.event.comment.body, '<!-- factory:') && contains(join(github.event.issue.labels.*.name, ','), 'factory:objective')) ||
      (github.event_name == 'check_suite' && startsWith(github.event.check_suite.head_branch, 'factory/')) ||
      (github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'factory/') && github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'factory/') && github.event.pull_request.head.repo.full_name == github.repository &&
       ((github.event.action == 'labeled' && github.event.label.name == 'factory:review') || github.event.action == 'ready_for_review')) ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'factory-stage')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    outputs: { start: "${{ steps.f.outputs.start }}", tick: "${{ steps.f.outputs.tick }}", issue: "${{ steps.f.outputs.issue_number }}" } # the Action's output is issue_number: an empty one would put every launch in one group
    steps:
      - uses: {{action}}
        id: f
        with: { mode: gate, app_id: "${{ secrets.FACTORY_APP_ID }}", app_private_key: "${{ secrets.FACTORY_APP_PRIVATE_KEY }}" }
  launch-event:
    name: launch (${{ needs.launch-gate.outputs.issue }})
    needs: launch-gate
    if: needs.launch-gate.outputs.start == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, actions: write } # actions: write only for the dispatcher tick after a requeue or a stop
    # The group is the Objective's only when the gate said start; a skipped job's group is its own run's, whatever GitHub
    # does with the group of a job it skips.
    concurrency: { group: "${{ needs.launch-gate.outputs.start == 'true' && format('factory-launch-factory/{0}', needs.launch-gate.outputs.issue) || format('factory-launch-none-{0}', github.run_id) }}", cancel-in-progress: false }
    steps:
      - uses: {{action}}
        id: f
        with:
          mode: launch
          app_id: ${{ secrets.FACTORY_APP_ID }}
          app_private_key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_team_id: ${{ secrets.VERCEL_TEAM_ID }}
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} # the harness's credential goes into the stage's environment only
          codex_api_key: ${{ secrets.CODEX_API_KEY }}
          copilot_github_token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} # credential: plan only; your own repository only
          ai_gateway_api_key: ${{ secrets.AI_GATEWAY_API_KEY }}
      - uses: actions/upload-artifact@v7
        if: always() && steps.f.outputs.usage_dir != ''
        with: { name: "${{ steps.f.outputs.usage_name }}", path: "${{ steps.f.outputs.usage_dir }}", retention-days: 90, overwrite: true } # the ended stage's usage, as the work and review jobs upload theirs
      - name: Dispatch tick (an answered Question is Queued, or a stage ended and its sandbox stopped)
        if: steps.f.outputs.exit == 'queued' || steps.f.outputs.exit == 'stopped' || steps.f.outputs.exit == 'tick'
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" } # no checkout here: gh names the repository from GH_REPO
        run: gh workflow run factory.yml || true
  launch-tick:
    # CI finished on an In-review Objective's PR head with no stage waiting on it (the gate's answer): the dispatcher's
    # merge pass runs now, not on GitHub's cron. In no Objective group: it starts nothing there, so it replaces no launch.
    name: merge tick (${{ needs.launch-gate.outputs.issue }})
    needs: launch-gate
    if: needs.launch-gate.outputs.tick == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { actions: write } # the dispatcher tick only
    steps:
      - name: Dispatch tick (the merge pass)
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: gh workflow run factory.yml
  image:
    # The sandbox image every stage starts from: FACTORY_SETUP run in a fresh sandbox beside a clone of the default
    # branch's head, the dependency store and the harness CLIs, kept as a snapshot and recorded by the Factory App on
    # its image issue (label factory:image). Built on each merge until today's builds reach FACTORY_IMAGE_DAILY_MINUTES,
    # then nightly; by hand with the workflow's `image` input. Never on a pull request: the image is the default branch's.
    if: >-
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      github.event.schedule == '41 10 * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.image == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: { contents: read } # the job token reads the default branch; the record is the App's (a token for issues only)
    # One build at a time; a newer merge replaces a pending one. Any run in this repository can join the group with
    # cancel-in-progress and cancel a build (Actions cannot stop that); the next build destroys what it left.
    concurrency: { group: factory-image, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false } # the image's clone gets the whole history, from a bundle
      - uses: {{action}}
        with:
          mode: image
          app_id: ${{ secrets.FACTORY_APP_ID }}
          app_private_key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_team_id: ${{ secrets.VERCEL_TEAM_ID }}
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}
  sweep:
    # The sandbox sweep: Factory's Objective sandboxes in the vendor's project that no live Objective needs (its issue
    # closed, its record naming another sandbox, or stopped FACTORY_SANDBOX_IDLE_DAYS with the Objective neither Running
    # nor In review) are destroyed, at most FACTORY_SWEEP_MAX_DESTROYS a run, then this repository's superseded images. A
    # stage's usage the launcher never collected is uploaded as the launcher would. Hourly, by hand, and when an
    # Objective closes or its PR merges, so a finished Objective's stop snapshot does not hold the vendor's storage.
    if: >-
      github.event.schedule == '17 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.sweep == 'true') ||
      (github.event_name == 'issues' && github.event.action == 'closed' && contains(join(github.event.issue.labels.*.name, ','), 'factory:objective')) ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && startsWith(github.head_ref, 'factory/') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read } # every write is the App's
    concurrency: { group: factory-sweep, cancel-in-progress: false }
    steps:
      - uses: {{action}}
        id: f
        with:
          mode: sweep
          app_id: ${{ secrets.FACTORY_APP_ID }}
          app_private_key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_team_id: ${{ secrets.VERCEL_TEAM_ID }}
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}
      - uses: actions/upload-artifact@v7
        if: always() && steps.f.outputs.usage_dir_1 != ''
        with: { name: "${{ steps.f.outputs.usage_name_1 }}", path: "${{ steps.f.outputs.usage_dir_1 }}", retention-days: 90, overwrite: true }
      - uses: actions/upload-artifact@v7
        if: always() && steps.f.outputs.usage_dir_2 != ''
        with: { name: "${{ steps.f.outputs.usage_name_2 }}", path: "${{ steps.f.outputs.usage_dir_2 }}", retention-days: 90, overwrite: true }
      - uses: actions/upload-artifact@v7
        if: always() && steps.f.outputs.usage_dir_3 != ''
        with: { name: "${{ steps.f.outputs.usage_name_3 }}", path: "${{ steps.f.outputs.usage_dir_3 }}", retention-days: 90, overwrite: true }
  # {{/sandbox}}
