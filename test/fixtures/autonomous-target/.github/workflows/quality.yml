name: Fixture quality
on: [pull_request]
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check src/alpha.mjs && node --check src/beta.mjs && node --check scripts/check.mjs
